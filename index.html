<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Cabinet - Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --white: #FFFFFF;
            --neon-pink: #FF10F0;
            --neon-yellow: #FFFF00;
            --neon-cyan: #00FFFF;
            --neon-green: #39FF14;
            --shadow: 8px 8px 0px rgba(0, 0, 0, 0.9);
            --shadow-hover: 12px 12px 0px rgba(0, 0, 0, 0.9);
        }

        body {
            font-family: 'Arial Black', sans-serif;
            background: var(--neon-yellow);
            color: var(--black);
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: var(--white);
            border-bottom: 6px solid var(--black);
            padding: 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.9);
        }

        h1 {
            font-size: 3rem;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 1.5rem;
            text-shadow: 4px 4px 0 var(--neon-pink);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group label {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        input[type="text"],
        select {
            padding: 0.75rem 1rem;
            border: 4px solid var(--black);
            background: var(--white);
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.9);
            outline: none;
            min-width: 200px;
        }

        input[type="text"]:focus,
        select:focus {
            background: var(--neon-cyan);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.9);
        }

        /* Gallery */
        .gallery {
            padding: 3rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 3rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Vinyl Item */
        .vinyl-item {
            position: relative;
            aspect-ratio: 1;
            cursor: pointer;
            perspective: 1000px;
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .vinyl-container {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .vinyl-item:hover .vinyl-container {
            transform: translateX(-15%) rotateY(-15deg);
        }

        .vinyl-cover {
            width: 100%;
            height: 100%;
            border: 6px solid var(--black);
            background: var(--white);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .vinyl-item:hover .vinyl-cover {
            box-shadow: var(--shadow-hover);
            border-color: var(--neon-pink);
        }

        .vinyl-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .vinyl-disc {
            position: absolute;
            width: 90%;
            height: 90%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #000000 100%);
            border: 4px solid var(--black);
            top: 5%;
            right: -60%;
            transform: translateZ(-10px);
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: -8px 8px 20px rgba(0, 0, 0, 0.6);
        }

        .vinyl-disc::before {
            content: '';
            position: absolute;
            width: 25%;
            height: 25%;
            background: var(--white);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid var(--black);
        }

        .vinyl-disc::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle at center,
                transparent 0px,
                transparent 2px,
                rgba(255, 255, 255, 0.03) 2px,
                rgba(255, 255, 255, 0.03) 4px
            );
        }

        .vinyl-item:hover .vinyl-disc {
            right: -40%;
        }

        .vinyl-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            border-top: 4px solid var(--black);
            padding: 1rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .vinyl-item:hover .vinyl-info {
            transform: translateY(0);
        }

        .vinyl-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
        }

        .vinyl-artist {
            font-size: 0.875rem;
            font-family: 'Courier New', monospace;
        }

        /* Preview Modal */
        .preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .preview-modal.active {
            display: flex;
            opacity: 1;
        }

        .preview-content {
            background: var(--white);
            border: 8px solid var(--black);
            box-shadow: 16px 16px 0 rgba(255, 16, 240, 0.5);
            max-width: 1200px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .preview-modal.active .preview-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 50px;
            height: 50px;
            background: var(--neon-pink);
            border: 4px solid var(--black);
            cursor: pointer;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.9);
            transition: all 0.2s ease;
            z-index: 10;
        }

        .close-btn:hover {
            background: var(--neon-cyan);
            transform: rotate(90deg);
        }

        .preview-header {
            display: flex;
            gap: 2rem;
            padding: 3rem;
            border-bottom: 6px solid var(--black);
            align-items: center;
            flex-wrap: wrap;
        }

        .preview-vinyl-container {
            position: relative;
            width: 300px;
            height: 300px;
            perspective: 1000px;
            flex-shrink: 0;
        }

        .preview-vinyl-disc {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #000000 100%);
            border: 6px solid var(--black);
            transform: translateX(20%) translateZ(-20px);
            box-shadow: -12px 12px 30px rgba(0, 0, 0, 0.6);
            animation: spinDisc 3s ease-in-out;
        }

        .preview-vinyl-disc::before {
            content: '';
            position: absolute;
            width: 30%;
            height: 30%;
            background: var(--white);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid var(--black);
        }

        .preview-vinyl-disc::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle at center,
                transparent 0px,
                transparent 3px,
                rgba(255, 255, 255, 0.03) 3px,
                rgba(255, 255, 255, 0.03) 6px
            );
        }

        .preview-vinyl-cover {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 6px solid var(--black);
            box-shadow: var(--shadow-hover);
            z-index: 2;
            animation: slideCover 3s ease-in-out;
        }

        .preview-vinyl-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @keyframes spinDisc {
            0% { transform: translateX(0%) translateZ(-20px) rotateY(0deg); }
            50% { transform: translateX(80%) translateZ(-20px) rotateY(180deg); }
            100% { transform: translateX(20%) translateZ(-20px) rotateY(360deg); }
        }

        @keyframes slideCover {
            0% { transform: translateX(0%); }
            50% { transform: translateX(-30%); }
            100% { transform: translateX(0%); }
        }

        .preview-main-info {
            flex: 1;
            min-width: 300px;
        }

        .preview-title {
            font-size: 2.5rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            line-height: 1;
            font-family: 'Courier New', monospace;
        }

        .preview-artist {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--neon-pink);
            text-shadow: 2px 2px 0 var(--black);
        }

        .preview-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .meta-tag {
            padding: 0.5rem 1rem;
            background: var(--neon-cyan);
            border: 3px solid var(--black);
            font-size: 0.875rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.9);
        }

        .meta-tag:hover {
            background: var(--neon-pink);
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.9);
        }

        .preview-body {
            padding: 3rem;
        }

        .tracklist-section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            text-transform: uppercase;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 4px solid var(--black);
            background: var(--neon-green);
            padding: 1rem;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.9);
        }

        .side {
            margin-bottom: 2rem;
        }

        .side-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            background: var(--neon-yellow);
            padding: 0.75rem;
            border: 3px solid var(--black);
            display: inline-block;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.9);
        }

        .track {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            border-left: 4px solid var(--black);
            margin-bottom: 0.5rem;
            background: var(--white);
            transition: all 0.2s ease;
        }

        .track:hover {
            background: var(--neon-cyan);
            border-left-width: 8px;
            transform: translateX(4px);
        }

        .track-number {
            font-weight: bold;
            margin-right: 1rem;
        }

        .track-name {
            flex: 1;
        }

        .track-duration {
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        /* Slide Panel */
        .slide-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 600px;
            height: 100%;
            background: var(--white);
            border-left: 8px solid var(--black);
            box-shadow: -16px 0 0 rgba(0, 0, 0, 0.5);
            z-index: 1100;
            transition: right 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            overflow-y: auto;
            padding: 3rem;
        }

        .slide-panel.active {
            right: 0;
        }

        .panel-title {
            font-size: 2rem;
            text-transform: uppercase;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 6px solid var(--black);
        }

        .panel-content {
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }

        /* Scroll Indicator */
        .scroll-indicator {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--black);
            color: var(--neon-yellow);
            padding: 1rem 2rem;
            border: 4px solid var(--neon-yellow);
            font-weight: bold;
            font-size: 1rem;
            z-index: 99;
            transition: bottom 0.3s ease;
            box-shadow: 0 -8px 0 rgba(255, 255, 0, 0.3);
        }

        .scroll-indicator.visible {
            bottom: 2rem;
        }

        /* Loading Indicator */
        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 1.5rem;
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 2rem;
                padding: 2rem 1rem;
            }

            .preview-header {
                flex-direction: column;
                padding: 2rem 1rem;
            }

            .preview-vinyl-container {
                width: 250px;
                height: 250px;
            }

            .preview-title {
                font-size: 1.75rem;
            }

            .preview-body {
                padding: 2rem 1rem;
            }
        }

        /* Stagger animation for gallery items */
        .vinyl-item {
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .vinyl-item:nth-child(1) { animation-delay: 0.1s; }
        .vinyl-item:nth-child(2) { animation-delay: 0.2s; }
        .vinyl-item:nth-child(3) { animation-delay: 0.3s; }
        .vinyl-item:nth-child(4) { animation-delay: 0.4s; }
        .vinyl-item:nth-child(5) { animation-delay: 0.5s; }
        .vinyl-item:nth-child(6) { animation-delay: 0.6s; }
        .vinyl-item:nth-child(n+7) { animation-delay: 0.7s; }
    </style>
</head>

                        name: "Side A",
                        tracks: [
                            { number: 1, name: "London Calling", duration: "3:19" },
                            { number: 2, name: "Brand New Cadillac", duration: "2:08" },
                            { number: 3, name: "Jimmy Jazz", duration: "3:54" },
                            { number: 4, name: "Hateful", duration: "2:44" }
                        ]
                    },
                    {
                        name: "Side B",
                        tracks: [
                            { number: 1, name: "Spanish Bombs", duration: "3:18" },
                            { number: 2, name: "The Right Profile", duration: "3:54" },
                            { number: 3, name: "Lost in the Supermarket", duration: "3:47" },
                            { number: 4, name: "Clampdown", duration: "3:49" }
                        ]
                    }
                ]
            }
        ];

        // State
        let currentData = [...vinylData];
        let currentPage = 1;
        let itemsPerPage = 6;
        let totalPages = Math.ceil(currentData.length / itemsPerPage);
        let currentRecord = null;

        // Initialize
        renderGallery();
        setupEventListeners();

        function setupEventListeners() {
            // Search
            document.getElementById('search').addEventListener('input', (e) => {
                filterAndSort();
            });

            // Filters
            document.getElementById('genre-filter').addEventListener('change', filterAndSort);
            document.getElementById('year-filter').addEventListener('change', filterAndSort);
            
            // Sort
            document.getElementById('sort').addEventListener('change', filterAndSort);

            // Scroll
            let scrollTimeout;
            window.addEventListener('scroll', () => {
                const indicator = document.getElementById('scroll-indicator');
                indicator.classList.add('visible');
                
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    indicator.classList.remove('visible');
                }, 2000);

                // Infinite scroll
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                    loadMore();
                }
            });

            // Close modal on escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closePreview();
                    closeSlidePanel();
                }
            });

            // Close modal on background click
            document.getElementById('preview-modal').addEventListener('click', (e) => {
                if (e.target.id === 'preview-modal') {
                    closePreview();
                }
            });
        }

        function filterAndSort() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const genreFilter = document.getElementById('genre-filter').value;
            const yearFilter = document.getElementById('year-filter').value;
            const sortBy = document.getElementById('sort').value;

            // Filter
            currentData = vinylData.filter(record => {
                const matchesSearch = record.title.toLowerCase().includes(searchTerm) || 
                                     record.artist.toLowerCase().includes(searchTerm);
                const matchesGenre = !genreFilter || record.genre === genreFilter;
                const matchesYear = !yearFilter || getDecade(record.year) === yearFilter;
                
                return matchesSearch && matchesGenre && matchesYear;
            });

            // Sort
            currentData.sort((a, b) => {
                switch(sortBy) {
                    case 'title':
                        return a.title.localeCompare(b.title);
                    case 'artist':
                        return a.artist.localeCompare(b.artist);
                    case 'year':
                        return b.year - a.year;
                    case 'genre':
                        return a.genre.localeCompare(b.genre);
                    default:
                        return 0;
                }
            });

            currentPage = 1;
            totalPages = Math.ceil(currentData.length / itemsPerPage);
            renderGallery();
            updateScrollIndicator();
        }

        function getDecade(year) {
            const decade = Math.floor(year / 10) * 10;
            return `${decade}s`;
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const startIndex = 0;
            const endIndex = currentPage * itemsPerPage;
            const itemsToShow = currentData.slice(startIndex, endIndex);

            gallery.innerHTML = itemsToShow.map(record => `
                <div class="vinyl-item" onclick="openPreview(${record.id})">
                    <div class="vinyl-container">
                        <div class="vinyl-cover">
                            <img src="${record.cover}" alt="${record.title}">
                        </div>
                        <div class="vinyl-disc"></div>
                    </div>
                    <div class="vinyl-info">
                        <div class="vinyl-title">${record.title}</div>
                        <div class="vinyl-artist">${record.artist}</div>
                    </div>
                </div>
            `).join('');
        }

        function loadMore() {
            if (currentPage >= totalPages) return;
            
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            setTimeout(() => {
                currentPage++;
                renderGallery();
                updateScrollIndicator();
                loading.style.display = 'none';
            }, 500);
        }

        function updateScrollIndicator() {
            document.getElementById('current-page').textContent = currentPage;
            document.getElementById('total-pages').textContent = totalPages;
        }

        function openPreview(id) {
            currentRecord = vinylData.find(r => r.id === id);
            if (!currentRecord) return;

            // Update preview content
            document.getElementById('preview-cover').src = currentRecord.cover;
            document.getElementById('preview-title').textContent = currentRecord.title;
            document.getElementById('preview-artist').textContent = currentRecord.artist;
            document.getElementById('preview-label').textContent = currentRecord.label;
            document.getElementById('preview-year').textContent = currentRecord.year;
            document.getElementById('preview-genre').textContent = currentRecord.genre.toUpperCase();

            // Render tracklist
            const tracklistContainer = document.getElementById('tracklist-container');
            tracklistContainer.innerHTML = currentRecord.sides.map(side => `
                <div class="side">
                    <div class="side-title">${side.name}</div>
                    ${side.tracks.map(track => `
                        <div class="track">
                            <span class="track-number">${track.number}.</span>
                            <span class="track-name">${track.name}</span>
                            <span class="track-duration">${track.duration}</span>
                        </div>
                    `).join('')}
                </div>
            `).join('');

            // Show modal
            const modal = document.getElementById('preview-modal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePreview() {
            const modal = document.getElementById('preview-modal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function openSlidePanel(type) {
            if (!currentRecord) return;

            const panel = document.getElementById('slide-panel');
            const title = document.getElementById('panel-title');
            const content = document.getElementById('panel-content');

            switch(type) {
                case 'label':
                    title.textContent = currentRecord.label;
                    content.innerHTML = `
                        <p><strong>Label:</strong> ${currentRecord.label}</p>
                        <p><strong>Founded:</strong> 1960s (example)</p>
                        <p><strong>Genre:</strong> ${currentRecord.genre}</p>
                        <p><strong>Location:</strong> United States</p>
                        <br>
                        <p>This is example content about the record label. In a real application, this would contain detailed information about the label's history, notable releases, and artists.</p>
                    `;
                    break;
                case 'year':
                    title.textContent = currentRecord.year;
                    content.innerHTML = `
                        <p><strong>Release Year:</strong> ${currentRecord.year}</p>
                        <p><strong>Decade:</strong> ${getDecade(currentRecord.year)}</p>
                        <br>
                        <p>This album was released in ${currentRecord.year}, during an influential period in ${currentRecord.genre} music. More historical context would appear here.</p>
                    `;
                    break;
                case 'genre':
                    title.textContent = currentRecord.genre.toUpperCase();
                    content.innerHTML = `
                        <p><strong>Genre:</strong> ${currentRecord.genre.toUpperCase()}</p>
                        <p><strong>Origin:</strong> Various</p>
                        <br>
                        <p>Information about the ${currentRecord.genre} genre, its characteristics, history, and influence would be displayed here.</p>
                    `;
                    break;
            }

            panel.classList.add('active');
        }

        function closeSlidePanel() {
            const panel = document.getElementById('slide-panel');
            panel.classList.remove('active');
        }
    </script>
</body>
</html>
