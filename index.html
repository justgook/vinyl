<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Cabinet - Netflix-Style Neobrutalism</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --white: #FFFFFF;
            --pink: #FF10F0;
            --yellow: #FFEB3B;
            --cyan: #00E5FF;
            --green: #76FF03;
            --orange: #FF6B35;
            --purple: #9C27B0;
            --red: #FF1744;
        }

        body {
            font-family: 'Space Grotesk', 'Arial Black', sans-serif;
            background: var(--white);
            color: var(--black);
            overflow-x: hidden;
        }

        /* Sticky Header */
        header {
            background: var(--yellow);
            border-bottom: 6px solid var(--black);
            padding: 1.5rem 3rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        header.hidden {
            transform: translateY(-100%);
        }

        .header-content {
            max-width: 1800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            text-shadow: 4px 4px 0 var(--pink);
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            border: 5px solid var(--black);
            font-size: 1.1rem;
            font-weight: 700;
            background: var(--white);
            box-shadow: 6px 6px 0 var(--black);
            transition: all 0.2s ease;
            font-family: 'Courier New', monospace;
        }

        .search-input:focus {
            outline: none;
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0 var(--black);
            background: var(--cyan);
        }

        /* Main Container */
        .main-container {
            background: var(--white);
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        /* Section Row */
        .section-row {
            margin: 3rem 0;
            position: relative;
        }

        .section-header {
            padding: 0 3rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            background: var(--pink);
            border: 5px solid var(--black);
            padding: 0.8rem 1.5rem;
            box-shadow: 6px 6px 0 var(--black);
            display: inline-block;
            letter-spacing: -1px;
        }

        .section-title.yellow { background: var(--yellow); }
        .section-title.cyan { background: var(--cyan); }
        .section-title.green { background: var(--green); }
        .section-title.orange { background: var(--orange); }
        .section-title.purple { background: var(--purple); color: var(--white); }

        .view-all-btn {
            padding: 0.6rem 1.2rem;
            background: var(--white);
            border: 4px solid var(--black);
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--black);
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .view-all-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--black);
            background: var(--green);
        }

        /* Horizontal Scroll Container */
        .scroll-container {
            position: relative;
            padding: 0 3rem;
        }

        .vinyl-row {
            display: flex;
            gap: 2rem;
            overflow-x: auto;
            overflow-y: visible;
            scroll-behavior: smooth;
            padding: 1rem 0 2rem 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .vinyl-row::-webkit-scrollbar {
            display: none;
        }

        /* Vinyl Card */
        .vinyl-card {
            min-width: 280px;
            width: 280px;
            height: 360px;
            position: relative;
            cursor: pointer;
            perspective: 1000px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .vinyl-card:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .cover-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: visible;
        }

        .album-cover {
            width: 100%;
            height: 100%;
            border: 6px solid var(--black);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 8px 8px 0 var(--black);
            position: relative;
            z-index: 2;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Vinyl Disc - IMPROVED: Starts hidden, slides out on hover */
        .vinyl-disc {
            position: absolute;
            width: 260px;
            height: 260px;
            top: 10px;
            right: 10px; /* Start inside/behind the cover */
            background: radial-gradient(circle at 30% 30%, #2a2a2a 0%, #000 40%, #1a1a1a 45%, #000 100%);
            border-radius: 50%;
            border: 5px solid var(--black);
            z-index: 1;
            opacity: 0; /* Hidden by default */
            transition: right 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        opacity 0.4s ease,
                        transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: -8px 8px 20px rgba(0, 0, 0, 0.5);
            pointer-events: none; /* Disable clicks on vinyl disc */
        }

        .vinyl-disc::before {
            content: '';
            position: absolute;
            width: 35%;
            height: 35%;
            top: 32.5%;
            left: 32.5%;
            background: radial-gradient(circle, #dc143c 0%, #8b0000 100%);
            border-radius: 50%;
            border: 4px solid var(--black);
        }

        .vinyl-disc::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: repeating-conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 0.5deg,
                rgba(255,255,255,0.04) 0.5deg,
                rgba(255,255,255,0.04) 1deg
            );
            border-radius: 50%;
        }

        /* IMPROVED: Vinyl slides OUT to the right on hover */
        .vinyl-card:hover .vinyl-disc {
            right: -140px; /* Slides out beyond the cover */
            opacity: 1; /* Becomes visible */
            transform: rotate(15deg);
        }

        .vinyl-card:hover .album-cover {
            transform: translateX(-15px) rotate(-2deg);
            box-shadow: 12px 12px 0 var(--black);
        }

        /* Card Info */
        .card-info {
            padding: 1rem 0.5rem 0 0.5rem;
            font-weight: 900;
        }

        .card-title {
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .card-artist {
            font-size: 0.9rem;
            font-weight: 700;
            color: #666;
        }

        .card-meta {
            font-size: 0.75rem;
            margin-top: 0.3rem;
            font-weight: 600;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.4s ease forwards;
        }

        .modal-overlay.closing {
            animation: fadeOut 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Detail Modal */
        .detail-modal {
            background: var(--white);
            border: 10px solid var(--black);
            max-width: 1200px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 20px 20px 0 var(--pink);
            transform: scale(0.3) translateY(-100px);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .detail-modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .close-modal-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 60px;
            height: 60px;
            background: var(--red);
            border: 5px solid var(--black);
            cursor: pointer;
            font-size: 2rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 5px 5px 0 var(--black);
            transition: all 0.2s ease;
            z-index: 10;
            color: var(--white);
        }

        .close-modal-btn:hover {
            transform: rotate(90deg) scale(1.1);
            background: var(--pink);
        }

        /* Modal Header with Vinyl Animation */
        .modal-header {
            background: var(--purple);
            border-bottom: 8px solid var(--black);
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }

        .modal-vinyl-display {
            display: flex;
            gap: 3rem;
            align-items: center;
            position: relative;
        }

        .modal-vinyl-container {
            position: relative;
            width: 350px;
            height: 350px;
            flex-shrink: 0;
            perspective: 1000px;
            overflow: visible; /* Allow vinyl to slide out during animation */
        }

        .modal-cover {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 8px solid var(--black);
            box-shadow: 12px 12px 0 var(--black);
            z-index: 3;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: coverSlide 2s ease-in-out forwards;
        }

        .modal-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-vinyl {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a2a 0%, #000 40%, #1a1a1a 45%, #000 100%);
            border: 8px solid var(--black);
            box-shadow: -12px 12px 30px rgba(0, 0, 0, 0.6);
            z-index: 2;
            animation: vinylRollOut 2s ease-in-out forwards;
            overflow: hidden; /* Clip shine effect to vinyl disc */
        }

        .modal-vinyl::before {
            content: '';
            position: absolute;
            width: 35%;
            height: 35%;
            top: 32.5%;
            left: 32.5%;
            background: 
                radial-gradient(circle, #dc143c 0%, #8b0000 100%);
            border-radius: 50%;
            border: 5px solid var(--black);
            z-index: 2;
        }

        .modal-vinyl::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: 
                /* Stronger grooves */
                repeating-conic-gradient(
                    from 0deg,
                    rgba(255,255,255,0.08) 0deg,
                    rgba(255,255,255,0.08) 2deg,
                    rgba(0,0,0,0.3) 2deg,
                    rgba(0,0,0,0.3) 4deg
                ),
                /* Radial grooves for depth */
                repeating-radial-gradient(
                    circle at center,
                    transparent 0%,
                    transparent 8%,
                    rgba(255,255,255,0.03) 8%,
                    rgba(255,255,255,0.03) 10%
                );
            animation: spin 3s linear infinite;
        }

        /* Vinyl center label with text */
        .vinyl-label {
            position: absolute;
            width: 35%;
            height: 35%;
            top: 32.5%;
            left: 32.5%;
            border-radius: 50%;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: spin 3s linear infinite;
            pointer-events: none;
        }

        .vinyl-label-text {
            font-family: 'Courier New', monospace;
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--white);
            text-align: center;
            line-height: 1.3;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.5px;
        }

        .vinyl-label-text.large {
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
            letter-spacing: 1px;
        }

        .vinyl-label-text.small {
            font-size: 0.5rem;
            opacity: 0.9;
            margin-top: 0.2rem;
        }

        .vinyl-label-divider {
            width: 60%;
            height: 1px;
            background: var(--white);
            margin: 0.25rem 0;
            opacity: 0.6;
        }

        /* Shine effect container for swoosh + rotating highlights */
        .modal-vinyl-shine {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            z-index: 3;
            pointer-events: none;
        }



        /* Retro swoosh effect - one-time horizontal sweep */
        .modal-vinyl-shine::before {
            content: '';
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -125%;
            background: linear-gradient(
                to right,
                transparent 0%,
                transparent 35%,
                rgba(255, 255, 255, 0.15) 40%,
                rgba(255, 255, 255, 0.6) 45%,
                rgba(255, 255, 255, 0.9) 50%,
                rgba(255, 255, 255, 0.6) 55%,
                rgba(255, 255, 255, 0.15) 60%,
                transparent 65%,
                transparent 100%
            );
            animation: retroSwoosh 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 2.2s forwards;
            transform: translateX(-100%) rotate(-15deg);
            opacity: 0;
        }

        @keyframes retroSwoosh {
            0% {
                transform: translateX(-100%) rotate(-15deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateX(100%) rotate(-15deg);
                opacity: 0;
            }
        }

        @keyframes coverSlide {
            0% {
                transform: translateX(0) rotate(0deg);
            }
            50% {
                transform: translateX(-80%) rotate(-10deg);
            }
            100% {
                transform: translateX(-40%) rotate(-5deg);
            }
        }

        @keyframes vinylRollOut {
            0% {
                transform: translateX(0);
                opacity: 0;
            }
            50% {
                transform: translateX(60%);
                opacity: 1;
            }
            100% {
                transform: translateX(30%);
                opacity: 1;
            }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes modalExit {
            0% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
            100% {
                transform: scale(0.8) translateY(50px) rotate(5deg);
                opacity: 0;
            }
        }

        .modal-info {
            flex: 1;
            color: var(--white);
            position: relative;
            z-index: 10; /* Keep info above vinyl animation */
        }

        .modal-title {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 1rem;
            line-height: 0.9;
            letter-spacing: -2px;
            position: relative;
            z-index: 11; /* Ensure title stays on top */
        }

        .modal-artist {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            position: relative;
            z-index: 11; /* Ensure artist stays on top */
        }

        .modal-tags {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
            position: relative;
            z-index: 11; /* Ensure tags stay on top */
        }

        .tag-btn {
            padding: 0.8rem 1.5rem;
            background: var(--cyan);
            border: 4px solid var(--black);
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--black);
            text-transform: uppercase;
            transition: all 0.2s ease;
            color: var(--black);
            position: relative;
            z-index: 12; /* Buttons need highest z-index for interaction */
        }

        .tag-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--black);
            background: var(--yellow);
        }

        /* Modal Body */
        .modal-body {
            padding: 3rem;
        }

        .tracklist-section {
            margin-bottom: 3rem;
        }

        .side-title {
            background: var(--yellow);
            border: 5px solid var(--black);
            padding: 1.2rem 1.5rem;
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            box-shadow: 6px 6px 0 var(--black);
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .track {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border: 4px solid var(--black);
            background: var(--white);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .track:hover {
            background: var(--green);
            transform: translateX(10px);
            box-shadow: 6px 6px 0 var(--black);
        }

        .track-num {
            font-weight: 900;
            font-size: 1.2rem;
            min-width: 40px;
        }

        .track-name {
            flex: 1;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .track-time {
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1rem;
        }

        /* Slide Panel Overlay */
        .panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2050;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .panel-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Slide Panel */
        .slide-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 700px;
            height: 100%;
            background: var(--white);
            border-left: 10px solid var(--black);
            box-shadow: -20px 0 0 rgba(0, 0, 0, 0.3);
            z-index: 2100;
            overflow-y: auto;
            transition: right 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .slide-panel.active {
            right: 0;
        }

        .panel-header {
            background: var(--pink);
            border-bottom: 8px solid var(--black);
            padding: 3rem;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .close-panel-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 50px;
            height: 50px;
            background: var(--black);
            color: var(--white);
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-panel-btn:hover {
            transform: rotate(90deg);
            background: var(--red);
        }

        .panel-title {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--white);
            text-shadow: 4px 4px 0 var(--black);
        }

        .panel-content {
            padding: 3rem;
            font-family: 'Courier New', monospace;
            line-height: 1.8;
        }

        .info-box {
            background: var(--cyan);
            border: 5px solid var(--black);
            padding: 2rem;
            margin: 1.5rem 0;
            box-shadow: 6px 6px 0 var(--black);
        }

        .info-box h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        /* Scroll Progress */
        .scroll-progress {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--black);
            color: var(--yellow);
            padding: 1rem 2rem;
            border: 5px solid var(--yellow);
            font-weight: 900;
            font-size: 1.2rem;
            z-index: 1500;
            box-shadow: 8px 8px 0 var(--yellow);
            transition: bottom 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .scroll-progress.visible {
            bottom: 2rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .search-container {
                max-width: 100%;
            }

            .section-title {
                font-size: 1.3rem;
            }

            .scroll-container {
                padding: 0 1.5rem;
            }

            .modal-header {
                padding: 2rem 1rem;
            }

            .modal-vinyl-display {
                flex-direction: column;
            }

            .modal-vinyl-container {
                width: 250px;
                height: 250px;
            }

            .modal-title {
                font-size: 2rem;
            }

            .slide-panel {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header id="header">
        <div class="header-content">
            <h1>🎵 VINYL CABINET</h1>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="SEARCH YOUR COLLECTION..." id="searchInput">
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Rows will be dynamically loaded from data/records.json -->
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="detail-modal">
            <button class="close-modal-btn" onclick="closeModal()">✕</button>
            
            <div class="modal-header">
                <div class="modal-vinyl-display">
                    <div class="modal-vinyl-container">
                        <div class="modal-vinyl">
                            <div class="modal-vinyl-shine"></div>
                            <div class="vinyl-label">
                                <div class="vinyl-label-text large">JUSTGOOK</div>
                                <div class="vinyl-label-divider"></div>
                                <div class="vinyl-label-text">Kazys</div>
                                <div class="vinyl-label-text">Kalabibishkis</div>
                                <div class="vinyl-label-divider"></div>
                                <div class="vinyl-label-text small">Riga, Latvia</div>
                            </div>
                        </div>
                        <div class="modal-cover" id="modalCover"></div>
                    </div>
                    <div class="modal-info">
                        <h2 class="modal-title" id="modalTitle">Album Title</h2>

        let allRecords = {};  // Store full record details by ID
        let recordsData = null;  // Homepage featured records
        let currentRecord = null;

        // Load JSON data
        async function loadData() {
            try {
                // Load full catalog for lookups
                const allResponse = await fetch('data/records-all.json');
                const allData = await allResponse.json();
                
                // Store in lookup object
                allData.records.forEach(record => {
                    allRecords[record.id] = record;
                });

                // Load homepage featured records
                const recordsResponse = await fetch('data/records.json');
                recordsData = await recordsResponse.json();

                // Initialize the page
                initializePage();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Initialize page with loaded data
        function initializePage() {
            renderRows();
            updateSectionCount();
        }

        // Render all category rows
        function renderRows() {
            const mainContainer = document.querySelector('.main-container');
            
            // Clear existing rows
            mainContainer.innerHTML = '';

            // Color mapping for categories
            const colors = ['pink', 'yellow', 'cyan', 'green', 'orange', 'purple'];

            // Render each row from recordsData
            recordsData.rows.forEach((row, index) => {
                const color = colors[index % colors.length];
                const rowHTML = createRowHTML(row.category, row.records, color);
                mainContainer.insertAdjacentHTML('beforeend', rowHTML);
            });

            // Add scroll progress indicator
            mainContainer.insertAdjacentHTML('beforeend', `
                <div class="scroll-progress" id="scrollProgress">
                    SECTION <span id="currentSection">1</span> / <span id="totalSections">${recordsData.rows.length}</span>
                </div>
            `);
        }

        // Create HTML for a row
        function createRowHTML(category, recordIds, color) {
            return `
                <div class="section-row">
                    <div class="section-header">
                        <div class="section-title ${color}">${category}</div>
                        <button class="view-all-btn" onclick="viewAll('${category}')">View All →</button>
                    </div>
                    <div class="scroll-container">
                        <div class="vinyl-row">
                            ${recordIds.map(id => createCardHTML(id)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Create HTML for a vinyl card
        function createCardHTML(recordId) {
            const record = allRecords[recordId];
            if (!record) return '';

            const artistsText = record.artists.join(', ');
            const genreText = record.genre ? record.genre[0] : '';

            return `
                <div class="vinyl-card" onclick="navigateToDetail('${recordId}')">
                    <div class="card-inner">
                        <div class="cover-wrapper">
                            <div class="album-cover" style="background-image: url('${record.imageUrl}'); background-size: cover; background-position: center;"></div>
                            <div class="vinyl-disc"></div>
                        </div>
                        <div class="card-info">
                            <div class="card-title">${record.album}</div>
                            <div class="card-artist">${artistsText}</div>
                            <div class="card-meta">${record.year}${genreText ? ' • ' + genreText : ''}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Open Modal
        function openModal(id) {
            currentRecord = vinylData.find(v => v.id === id);
            if (!currentRecord) return;

            document.getElementById('modalTitle').textContent = currentRecord.title;
            document.getElementById('modalArtist').textContent = currentRecord.artist;
            document.getElementById('modalYear').textContent = currentRecord.year;
            document.getElementById('modalLabel').textContent = currentRecord.label;
            document.getElementById('modalGenre').textContent = currentRecord.genre;
            document.getElementById('modalCover').style.background = currentRecord.cover;

            // Render Tracks
            document.getElementById('sideA').innerHTML = currentRecord.sideA.map(track => `
                <div class="track">
                    <span class="track-num">A${track.number}</span>
                    <span class="track-name">${track.title}</span>
                    <span class="track-time">${track.duration}</span>
                </div>
            `).join('');

            document.getElementById('sideB').innerHTML = currentRecord.sideB.map(track => `
                <div class="track">
                    <span class="track-num">B${track.number}</span>
                    <span class="track-name">${track.title}</span>
                    <span class="track-time">${track.duration}</span>
                </div>
            `).join('');

            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modalOverlay = document.getElementById('modalOverlay');
            const detailModal = modalOverlay.querySelector('.detail-modal');
            
            // Trigger exit animations
            modalOverlay.classList.add('closing');
            detailModal.style.animation = 'modalExit 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
            
            // Wait for animation to complete before hiding
            setTimeout(() => {
                modalOverlay.classList.remove('active', 'closing');
                document.body.style.overflow = 'auto';
                // Reset animation for next open
                detailModal.style.animation = '';
            }, 400);
        }

        // Open Panel
        function openPanel(type) {
            if (!currentRecord) return;

            const panel = document.getElementById('slidePanel');
            const title = document.getElementById('panelTitle');
            const content = document.getElementById('panelContent');

            switch(type) {
                case 'year':
                    title.textContent = currentRecord.year;
                    content.innerHTML = `
                        <div class="info-box">
                            <h3>Release Year</h3>
                            <p><strong>Year:</strong> ${currentRecord.year}</p>
                            <p><strong>Era:</strong> ${Math.floor(currentRecord.year / 10) * 10}s</p>
                        </div>
                        <p>This album was released in ${currentRecord.year}, a significant year in music history. 
                        The ${Math.floor(currentRecord.year / 10) * 10}s were known for innovation and cultural shifts in the music industry.</p>
                        <div class="info-box">
                            <h3>Other Albums from ${currentRecord.year}</h3>
                            <p>Check your collection for more gems from this year!</p>
                        </div>
                    `;
                    break;
                case 'label':
                    title.textContent = currentRecord.label;
                    content.innerHTML = `
                        <div class="info-box">

                            <p><strong>Label:</strong> ${currentRecord.label}</p>
                            <p><strong>Genre Focus:</strong> ${currentRecord.genre}</p>
                        </div>
                        <p>${currentRecord.label} has been a major force in the music industry, 
                        releasing countless influential albums and supporting innovative artists.</p>
                        <div class="info-box">
                            <h3>More from ${currentRecord.label}</h3>
                            <p>Browse other albums in your collection from this legendary label.</p>
                        </div>
                    `;
                    break;
                case 'genre':
                    title.textContent = currentRecord.genre;
                    content.innerHTML = `

                            <p><strong>Origin:</strong> Various influences</p>
                        </div>

                        <div class="info-box">
                            <h3>Your ${currentRecord.genre} Collection</h3>
                            <p>Explore more ${currentRecord.genre} albums in your vinyl cabinet!</p>
                        </div>
                    `;
                    break;
            }

            panel.classList.add('active');
            document.getElementById('panelOverlay').classList.add('active');
        }

        function closePanel() {
            document.getElementById('slidePanel').classList.remove('active');
            document.getElementById('panelOverlay').classList.remove('active');
        }

        // Scroll Progress
        let scrollTimeout;
        let lastScroll = 0;
        const header = document.getElementById('header');

        window.addEventListener('scroll', () => {
            const scrollProgress = document.getElementById('scrollProgress');
            if (!scrollProgress) return;
            
            scrollProgress.classList.add('visible');

            // Hide header on scroll down
            const currentScroll = window.pageYOffset;
            if (currentScroll > lastScroll && currentScroll > 100) {
                header.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
            }
            lastScroll = currentScroll;

            // Update section indicator
            const sections = document.querySelectorAll('.section-row');
            let currentSection = 1;
            sections.forEach((section, index) => {
                const rect = section.getBoundingClientRect();
                if (rect.top <= window.innerHeight / 2 && rect.bottom >= window.innerHeight / 2) {
                    currentSection = index + 1;
                }
            });

            const currentSectionEl = document.getElementById('currentSection');
            if (currentSectionEl) {
                currentSectionEl.textContent = currentSection;
            }

            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                scrollProgress.classList.remove('visible');
            }, 1500);
        });

            document.getElementById('currentSection').textContent = currentSection;
            document.getElementById('totalSections').textContent = sections.length;

            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                scrollProgress.classList.remove('visible');
            }, 2000);
        });

            }
        });

        // Initialize app when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
