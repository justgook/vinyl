<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vinyl Cabinet - Content Manager</title>

  <style>
    /* Custom styling for CMS interface */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }

    /* Neobrutalism theme for CMS */
    :root {
      --nc-primary: #FF10F0;
      --nc-secondary: #00D9FF;
      --nc-accent: #FFFF00;
      --nc-bg: #FFFFFF;
      --nc-text: #000000;
    }
  </style>
</head>

<body>
  <!-- DecapCMS app will mount here -->

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Custom preview styles (optional)
    CMS.registerPreviewStyle('/style.css');

    // Custom preview template for records (optional future enhancement)
    // This will show a preview of how the record will look on the site
    CMS.registerPreviewTemplate('records', ({entry, widgetFor, widgetsFor}) => {
      const data = entry.get('data').toJS();

      return `
        <div style="padding: 20px; font-family: sans-serif;">
          <h1>${data.album}</h1>
          <p><strong>Artist:</strong> ${data.artists ? data.artists.join(', ') : 'Unknown'}</p>
          <p><strong>Year:</strong> ${data.year}</p>
          <p><strong>Label:</strong> ${data.recordLabel}</p>
          <p><strong>Genre:</strong> ${data.genre ? data.genre.join(', ') : 'Unknown'}</p>
          <p><strong>Catalog #:</strong> ${data.catalogNumber}</p>
          <p><strong>Condition:</strong> ${data.condition}</p>
          ${data.imageUrl ? `<img src="${data.imageUrl}" alt="${data.album}" style="max-width: 300px; border: 3px solid #000;">` : ''}
        </div>
      `;
    });

    console.log('DecapCMS initialized for Vinyl Cabinet');
  </script>
</body>

</html>
