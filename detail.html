<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Details - Vinyl Cabinet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --white: #FFFFFF;
            --pink: #FF10F0;
            --yellow: #FFEB3B;
            --cyan: #00E5FF;
            --green: #76FF03;
            --orange: #FF6B35;
            --purple: #9C27B0;
            --red: #FF1744;
        }

        body {
            font-family: 'Space Grotesk', 'Arial Black', sans-serif;
            background: rgba(0, 0, 0, 0.95);
            color: var(--black);
            overflow-x: hidden;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        /* Detail Modal Container */
        .detail-modal {
            background: var(--white);
            border: none;
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            position: relative;
            box-shadow: none;
            margin: 0;
        }

        .close-modal-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 60px;
            height: 60px;
            background: var(--red);
            border: 5px solid var(--black);
            cursor: pointer;
            font-size: 2rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 5px 5px 0 var(--black);
            transition: all 0.2s ease;
            z-index: 10;
            color: var(--white);
            text-decoration: none;
        }

        .close-modal-btn:hover {
            transform: rotate(90deg) scale(1.1);
            background: var(--pink);
        }

        /* Modal Header with Vinyl Animation */
        .modal-header {
            background: var(--purple);
            border-bottom: 8px solid var(--black);
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }

        .modal-vinyl-display {
            display: flex;
            gap: 3rem;
            align-items: center;
            position: relative;
        }

        .modal-vinyl-container {
            position: relative;
            width: 350px;
            height: 350px;
            flex-shrink: 0;
            perspective: 1000px;
            overflow: visible;
        }

        .modal-cover {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 8px solid var(--black);
            box-shadow: none;
            z-index: 4;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: coverSlide 2s ease-in-out forwards;
        }

        .modal-cover::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            box-shadow: 12px 12px 0 var(--black);
            z-index: -1;
            pointer-events: none;
        }

        .modal-vinyl {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a2a 0%, #000 40%, #1a1a1a 45%, #000 100%);
            border: 8px solid var(--black);
            box-shadow: -12px 12px 30px rgba(0, 0, 0, 0.6);
            z-index: 3;
            animation: vinylRollOut 2s ease-in-out forwards;
            overflow: hidden;
        }

        .modal-vinyl-rotating {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            z-index: 2;
            animation: spin 3s linear infinite;
        }

        .modal-vinyl-rotating::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: 
                repeating-conic-gradient(
                    from 0deg,
                    rgba(255,255,255,0.08) 0deg,
                    rgba(255,255,255,0.08) 2deg,
                    rgba(0,0,0,0.3) 2deg,
                    rgba(0,0,0,0.3) 4deg
                ),
                repeating-radial-gradient(
                    circle at center,
                    transparent 0%,
                    transparent 8%,
                    rgba(255,255,255,0.03) 8%,
                    rgba(255,255,255,0.03) 10%
                );
        }

        .modal-vinyl-center {
            position: absolute;
            width: 35%;
            height: 35%;
            top: 32.5%;
            left: 32.5%;
            background: radial-gradient(circle, #dc143c 0%, #8b0000 100%);
            border-radius: 50%;
            border: 5px solid var(--black);
            overflow: hidden;
        }

        .modal-vinyl-center {
            position: absolute;
            width: 35%;
            height: 35%;
            top: 32.5%;
            left: 32.5%;
            background: radial-gradient(circle, #dc143c 0%, #8b0000 100%);
            border-radius: 50%;
            border: 5px solid var(--black);
            overflow: hidden;
        }

        .vinyl-label {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 50%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .vinyl-label-text {
            font-family: 'Courier New', monospace;
            font-size: 0.45rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--white);
            text-align: center;
            line-height: 1.2;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            letter-spacing: 0.3px;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .vinyl-label-text.large {
            font-size: 0.55rem;
            margin-bottom: 0.2rem;
            letter-spacing: 0.5px;
        }

        .vinyl-label-text.small {
            font-size: 0.4rem;
            opacity: 0.9;
            margin-top: 0.15rem;
        }

        .vinyl-label-divider {
            width: 60%;
            height: 1px;
            background: var(--white);
            margin: 0.25rem 0;
            opacity: 0.6;
        }

        .modal-vinyl-shine {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            z-index: 3;
            pointer-events: none;
        }

        .modal-vinyl-shine::before {
            content: '';
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -125%;
            background: linear-gradient(
                to right,
                transparent 0%,
                transparent 35%,
                rgba(255, 255, 255, 0.15) 40%,
                rgba(255, 255, 255, 0.6) 45%,
                rgba(255, 255, 255, 0.9) 50%,
                rgba(255, 255, 255, 0.6) 55%,
                rgba(255, 255, 255, 0.15) 60%,
                transparent 65%,
                transparent 100%
            );
            animation: retroSwoosh 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 2.2s forwards;
            transform: translateX(-100%) rotate(-15deg);
            opacity: 0;
        }

        @keyframes retroSwoosh {
            0% {
                transform: translateX(-100%) rotate(-15deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateX(100%) rotate(-15deg);
                opacity: 0;
            }
        }

        @keyframes coverSlide {
            0% {
                transform: translateX(0) rotate(0deg);
            }
            50% {
                transform: translateX(-80%) rotate(-10deg);
            }
            100% {
                transform: translateX(-40%) rotate(-5deg);
            }
        }

        @keyframes vinylRollOut {
            0% {
                transform: translateX(0);
                opacity: 0;
            }
            50% {
                transform: translateX(60%);
                opacity: 1;
            }
            100% {
                transform: translateX(30%);
                opacity: 1;
            }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .modal-info {
            flex: 1;
            color: var(--white);
            position: relative;
            z-index: 10;
        }

        .modal-title {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 1rem;
            line-height: 0.9;
            letter-spacing: -2px;
            position: relative;
            z-index: 11;
        }

        .modal-artist {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            position: relative;
            z-index: 11;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
        }

        .artist-label {
            font-size: 1rem;
            text-transform: uppercase;
            opacity: 0.8;
            font-weight: 900;
        }

        .artist-link {
            padding: 0.6rem 1.2rem;
            background: var(--white);
            border: 3px solid var(--black);
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--black);
            transition: all 0.2s ease;
            color: var(--black);
            text-decoration: none;
            display: inline-block;
        }

        .artist-link:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--black);
            background: var(--green);
        }

        .modal-tags {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
            position: relative;
            z-index: 11;
        }

        .tag-btn {
            padding: 0.8rem 1.5rem;
            background: var(--cyan);
            border: 4px solid var(--black);
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--black);
            text-transform: uppercase;
            transition: all 0.2s ease;
            color: var(--black);
            position: relative;
            z-index: 12;
            text-decoration: none;
            display: inline-block;
        }

        .tag-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--black);
            background: var(--yellow);
        }

        .genre-tag {
            background: var(--pink);
        }

        .genre-tag:hover {
            background: var(--orange);
        }

        .modal-body {
            padding: 3rem;
        }

        .sides-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .tracklist-section {
            margin-bottom: 0;
        }

        @media (max-width: 900px) {
            .sides-container {
                grid-template-columns: 1fr;
            }
        }

        .side-title {
            background: var(--yellow);
            border: 5px solid var(--black);
            padding: 1.2rem 1.5rem;
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            box-shadow: 6px 6px 0 var(--black);
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .track {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border: 4px solid var(--black);
            background: var(--white);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .track:hover {
            background: var(--green);
            transform: translateX(10px);
            box-shadow: 6px 6px 0 var(--black);
        }

        .track-num {
            font-weight: 900;
            font-size: 1.2rem;
            min-width: 40px;
        }

        .track-name {
            flex: 1;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .track-time {
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 1rem;
        }

        

        @media (max-width: 768px) {
            .modal-header {
                padding: 2rem 1rem;
            }

            .modal-vinyl-display {
                flex-direction: column;
            }

            .modal-vinyl-container {
                width: 250px;
                height: 250px;
            }

            .modal-title {
                font-size: 2rem;
            }

            .modal-artist {
                font-size: 1rem;
            }

            .artist-link {
                font-size: 1rem;
                padding: 0.5rem 1rem;
            }

            .tag-btn, .genre-tag {
                font-size: 0.85rem;
                padding: 0.6rem 1rem;
            }

            .sides-container {
                grid-template-columns: 1fr;
            }
        }

        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 2rem;
            font-weight: 900;
            color: var(--white);
        }

        .error {
            text-align: center;
            padding: 4rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--red);
        }
    </style>
</head>
<body>
    <div class="detail-modal">
        <a href="index.html" class="close-modal-btn">✕</a>
        <div id="content">
            <div class="loading">Loading...</div>
        </div>
    </div>

    

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const recordId = urlParams.get('id');
        let currentRecord = null;

        if (!recordId) {
            document.getElementById('content').innerHTML = '<div class="error">No record ID provided</div>';
        } else {
            loadRecord(recordId);
        }

        async function loadRecord(id) {
            try {
                const response = await fetch(`data/records/${id}.json`);
                
                if (!response.ok) {
                    throw new Error('Record not found');
                }

                const record = await response.json();
                currentRecord = record;
                renderRecord(record);
                
                document.title = `${record.album} - ${record.artists.join(', ')} - Vinyl Cabinet`;
            } catch (error) {
                console.error('Error loading record:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <p>Failed to load record</p>
                        <p style="font-size: 1rem; margin-top: 1rem;">${error.message}</p>
                    </div>
                `;
            }
        }

        function renderRecord(record) {
            const artistsText = record.artists.join(', ');
            
            // Generate artist links HTML
            const artistsHTML = record.artists.map(artist => 
                `<a href="filter.html?type=artist&value=${encodeURIComponent(artist)}" class="artist-link">${artist}</a>`
            ).join('');
            
            // Generate genre tags HTML
            const genreTagsHTML = record.genre ? record.genre.map(genre => 
                `<a href="filter.html?type=genre&value=${encodeURIComponent(genre)}" class="tag-btn genre-tag">${genre}</a>`
            ).join('') : '';

            const html = `
                <div class="modal-header">
                    <div class="modal-vinyl-display">
                        <div class="modal-vinyl-container">
                            <div class="modal-vinyl">
                                <div class="modal-vinyl-shine"></div>
                                <div class="modal-vinyl-rotating">
                                    <div class="modal-vinyl-center">
                                        <div class="vinyl-label">
                                            <div class="vinyl-label-text large">${record.recordLabel}</div>
                                            <div class="vinyl-label-divider"></div>
                                            <div class="vinyl-label-text">${artistsText}</div>
                                            <div class="vinyl-label-divider"></div>
                                            <div class="vinyl-label-text small">${record.catalogNumber}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-cover" style="background-image: url('${record.imageUrl}'); background-size: cover; background-position: center;"></div>
                        </div>
                        <div class="modal-info">
                            <h2 class="modal-title">${record.album}</h2>
                            <div class="modal-artist">
                                <span class="artist-label">by</span>
                                ${artistsHTML}
                            </div>
                            <div class="modal-tags">
                                <a href="filter.html?type=year&value=${encodeURIComponent(record.year)}" class="tag-btn">
                                    📅 ${record.year}
                                </a>
                                <a href="filter.html?type=label&value=${encodeURIComponent(record.recordLabel)}" class="tag-btn">
                                    🏷️ ${record.recordLabel}
                                </a>
                                ${genreTagsHTML}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-body">
                    <div class="sides-container">
                        ${record.sides.map((side, index) => `
                            <div class="tracklist-section">
                                <div class="side-title">${index === 0 ? '◀' : '▶'} ${side.name}</div>
                                <div class="track-list">
                                    ${side.tracks.map((track, trackIndex) => `
                                        <div class="track">
                                            <span class="track-num">${String.fromCharCode(65 + index)}${trackIndex + 1}</span>
                                            <span class="track-name">${track.title}</span>
                                            <span class="track-time">${track.duration}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        
    </script>
</body>
</html>
